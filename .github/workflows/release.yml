# ABOUTME: GitHub Actions release workflow for tracker.
# ABOUTME: Publishes tagged releases through the repository's GoReleaser config.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Docs drift gate (release is in CHANGELOG + website)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/docs/gate.sh release-version "$RELEASE_TAG"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
