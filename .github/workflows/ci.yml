# ABOUTME: GitHub Actions CI workflow for tracker.
# ABOUTME: Enforces all quality gates: format, vet, build, test, race, coverage, dippin lint, doctor.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs on any ref: lets a Linux-only gate (e.g. the Landlock jail
  # suite) be exercised on a feature branch from a macOS dev box before merge.
  # jail_stress_count sizes the jail-linux stress step (#658): -count for the
  # -race loop over the Landlock-gated tests; 20 by default, 200 nightly.
  workflow_dispatch:
    inputs:
      jail_stress_count:
        description: "-count for the jail-linux stress step (Landlock-gated tests under -race)"
        required: false
        default: "20"
  # Nightly stress of the Landlock jail suite (#658): the witnessed race test
  # and its siblings at -count=200 under -race, so a scheduler-dependent flake
  # surfaces here before it reddens a release merge.
  schedule:
    - cron: "17 6 * * *"

jobs:
  quality-gates:
    name: Quality Gates
    # The nightly schedule is jail-only; the full gate set runs on every push
    # and PR already.
    if: github.event_name != 'schedule'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # No separate dippin install: the Dippin gate (make lint / make doctor)
      # runs `go run ...@<version from go.mod>`, the single version authority.

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Tests
        run: make test-short

      - name: Race detector
        run: make test-race

      - name: Coverage
        run: make coverage

      - name: Dippin gate contract
        run: bash scripts/dippin/gate_test.sh

      - name: Dippin lint
        run: make lint

      - name: Dippin doctor
        run: make doctor

      - name: Agent-tool jail lint
        run: make tools-jail-check

      - name: Docs drift gate (CLI commands documented)
        run: make docs-check

      - name: Shell gate contract
        run: bash scripts/shell/gate_test.sh

      - name: Shell hygiene gate (no pipes into early-exiting consumers under pipefail)
        run: make shell-check

      - name: Complexity gate
        run: bash scripts/complexity/gate.sh gate

      - name: Complexity baseline may only shrink
        if: github.event_name == 'pull_request'
        run: bash scripts/complexity/gate.sh baseline-shrinks "${{ github.event.pull_request.base.sha }}"

      - name: Verify tracker binary
        run: ./bin/tracker --help

      - name: Verify tracker-conformance binary
        run: ./bin/tracker-conformance list-handlers | grep -F stack.manager_loop

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tracker-binaries-linux-amd64
          path: |
            bin/tracker
            bin/tracker-conformance
          retention-days: 7

  # The writable_paths jail (Landlock ABI v3) only executes on a Linux kernel
  # that actually has Landlock. The Blacksmith runner above does NOT
  # (landlock_create_ruleset -> ENOSYS), so every Landlock-gated test —
  # TestWritablePathsEnforcement, TestConfigureJail_HappyPathWiresEnv,
  # TestConfigureJail_Closures_Rapid, TestParallelBranchSymlinkRace (spec D6),
  # TestRunJailExec_*, cmd/tracker TestJailExecDispatch, the #648 C3
  # prefer==require equivalence — had been silently SKIPPING there (found by
  # the #648 review; the openat2-only tests ran there because they need
  # openat2, not Landlock). This job runs the WHOLE short suite verbosely on a
  # GitHub-hosted ubuntu-24.04 image (kernel 6.8, Landlock enabled) and fails
  # if (a) the two literal PASS lines are missing or (b) ANY test skipped
  # because Landlock was unavailable — so a runner without Landlock, or a new
  # Landlock-gated test in any package, can never again read as green. Skips
  # that fire BECAUSE Landlock is present ("Landlock available ...") are the
  # legitimate complement and are not matched.
  jail-linux:
    name: Jail enforcement (Landlock, Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Landlock must be available on this runner
        run: |
          go test ./agent/exec -run 'TestProbeLandlock_OnSupportedKernel' -v -count=1 2>&1 | tee probe.log
          grep -q -- '--- PASS: TestProbeLandlock_OnSupportedKernel' probe.log

      # `set -o pipefail` + the explicit FAIL grep (#658): without pipefail
      # `tee` masked a failing `go test` exit — four red attempts reported this
      # step as SUCCESS while jail.log carried "FAIL github.com/.../pipeline/handlers"
      # and only the PASS-line grep below caught them. Now a failing package
      # fails THIS step, with the failing test's own output printed.
      - name: Full short suite, verbose (Landlock-gated tests execute here)
        shell: bash
        run: |
          set -o pipefail
          go test ./... -short -v -count=1 2>&1 | tee jail.log
          if grep -q '^FAIL' jail.log; then
            echo "::error::go test reported FAIL (see jail.log excerpt above)"
            grep -B30 -- '--- FAIL' jail.log || true
            exit 1
          fi

      - name: Jail PASS lines are in the record
        run: |
          grep -q -- '--- PASS: TestConfigureJail_C3_PreferJailsWhenLandlockAvailable' jail.log
          grep -q -- '--- PASS: TestWritablePathsEnforcement' jail.log
          grep -q -- '--- PASS: TestParallelBranchSymlinkRace' jail.log
          grep -q -- '--- PASS: TestJailExecDispatch' jail.log
          grep -q -- '--- PASS: TestRunJailExec_AllowsDevNull' jail.log

      - name: No Landlock-motivated skips
        run: |
          # A skip reason is printed on the line(s) before its "--- SKIP"; match
          # the absence-class reasons exactly as the tests phrase them.
          if grep -B2 -- '--- SKIP' jail.log | grep -Ei "Landlock unavailable|doesn't support Landlock|Landlock not (supported|available)"; then
            echo "::error::Landlock-gated tests skipped on the Landlock runner (see above)"; exit 1
          fi

      # Stress step (#658): the Landlock-gated tests -count=N under -race. The
      # witnessed race test terminates on witness-or-deadline, so a flake here
      # is a real finding, not scheduler luck. PASS-count EQUALITY (not >= 1)
      # is asserted per test so a skip, a panic, or a single failed iteration
      # fails closed; `-count` is 20 on push/dispatch (overridable through the
      # jail_stress_count input) and 200 on the nightly schedule.
      - name: Jail stress (Landlock-gated tests, -race, -count=N)
        shell: bash
        env:
          STRESS_COUNT: ${{ github.event_name == 'schedule' && '200' || (inputs.jail_stress_count || '20') }}
        run: |
          set -o pipefail
          echo "stress count: $STRESS_COUNT"
          # Fail closed on a non-positive count (#658): `go test -count=0` runs
          # nothing and every PASS-count equality below compares 0 == 0, so a
          # manual dispatch with jail_stress_count=0 (or a non-numeric value)
          # would read as green without exercising the jail at all. Reject
          # anything that is not a positive integer before running the suite.
          case "$STRESS_COUNT" in
            ''|*[!0-9]*)
              echo "::error::jail_stress_count must be a positive integer, got '$STRESS_COUNT'"; exit 1 ;;
          esac
          if [ "$STRESS_COUNT" -lt 1 ]; then
            echo "::error::jail_stress_count must be >= 1, got '$STRESS_COUNT'"; exit 1
          fi
          status=0
          # -timeout=60m (#658): the nightly schedule runs -count=200 and the
          # witnessed TestParallelBranchSymlinkRace can wait up to its 5s
          # deadline per iteration, so the combined -race binary can exceed Go's
          # default 10m harness timeout and fail for harness reasons, not a real
          # finding. Size the timeout for the largest scheduled count.
          go test ./pipeline/handlers ./agent/exec -short -race -count="$STRESS_COUNT" -timeout=60m -v \
            -run 'TestParallelBranchSymlinkRace$|TestWritablePathsEnforcement$|TestConfigureJail_C3|TestRunJailExec_' \
            2>&1 | tee stress.log || status=$?
          for name in TestParallelBranchSymlinkRace TestWritablePathsEnforcement TestRunJailExec_AllowsDevNull TestConfigureJail_C3_PreferJailsWhenLandlockAvailable; do
            got=$(grep -c -- "^--- PASS: $name " stress.log || true)
            echo "$name: $got PASS lines (want $STRESS_COUNT)"
            if [ "$got" != "$STRESS_COUNT" ]; then
              echo "::error::$name passed $got/$STRESS_COUNT iterations"; status=1
            fi
          done
          if grep -q '^FAIL' stress.log; then
            echo "::error::go test reported FAIL in the stress run"; status=1
          fi
          if [ "$status" != 0 ]; then
            echo "::group::failing iterations (30 lines of context each)"
            grep -B30 -- '--- FAIL' stress.log || true
            echo "::endgroup::"
            exit 1
          fi
